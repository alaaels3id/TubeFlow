<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#461220" />
      <stop offset="100%" stop-color="#1c070d" />
    </linearGradient>

    <!-- Play Triangle Gradients -->
    <linearGradient id="playGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C2F39" />
      <stop offset="100%" stop-color="#461220" />
    </linearGradient>
    <linearGradient id="playGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B23A48" />
      <stop offset="100%" stop-color="#8C2F39" />
    </linearGradient>

    <!-- Wave Stream Gradients -->
    <linearGradient id="ceruleanStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3AA6D0" />
      <stop offset="60%" stop-color="#247BA0" />
      <stop offset="100%" stop-color="#1B5F7D" />
    </linearGradient>

    <linearGradient id="blushStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCB9B2" />
      <stop offset="100%" stop-color="#E58D96" />
    </linearGradient>

    <linearGradient id="mauveStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B23A48" />
      <stop offset="100%" stop-color="#8C2F39" />
    </linearGradient>

    <!-- Subtle Drop Shadows -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#8C2F39" stroke-width="2" stroke-opacity="0.4" />

  <!-- Play Symbol (Geometric Youtube Triangle) -->
  <path d="M200 148 C192 143 180 149 180 160 L180 320 C180 331 192 337 200 332 L332 252 C341 247 341 233 332 228 Z" fill="url(#playGrad1)" />
  <!-- Play Facet for depth -->
  <path d="M180 160 L280 240 L180 320 Z" fill="url(#playGrad2)" opacity="0.65" />

  <!-- Flowing Ribbon Stream 1 (Dusty Mauve Outer Wave) -->
  <path d="M 215 170 
           C 255 220, 130 250, 130 330 
           C 130 400, 220 420, 275 385 
           C 310 362, 335 320, 365 315 
           C 340 345, 300 420, 240 435 
           C 150 445, 95 380, 100 310 
           C 105 240, 205 200, 215 170 Z" 
        fill="url(#mauveStream)" />

  <!-- Flowing Ribbon Stream 2 (Powder Blush Accent Wave) -->
  <path d="M 235 185 
           C 265 225, 155 260, 150 330 
           C 145 385, 210 405, 260 380 
           C 295 362, 325 318, 355 312 
           C 330 338, 290 395, 240 408 
           C 175 418, 125 375, 128 320 
           C 132 260, 225 215, 235 185 Z" 
        fill="url(#blushStream)" opacity="0.95" />

  <!-- Dynamic Fluid Flow (Cerulean Arrow Stream) -->
  <path d="M 255 200 
           C 280 235, 180 270, 175 330 
           C 170 375, 220 390, 265 365 
           C 305 342, 330 300, 370 295 
           L 370 250 
           L 440 325 
           L 370 400 
           L 370 355 
           C 320 360, 280 395, 235 410 
           C 180 420, 145 380, 150 330 
           C 155 270, 245 228, 255 200 Z" 
        fill="url(#ceruleanStream)" />
</svg>
